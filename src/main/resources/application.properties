spring.application.name=coworkhub

# Si existe local.properties (solo en mi PC, no se sube a GitHub) sus valores reemplazan a los de abajo
spring.config.import=optional:classpath:local.properties

server.port=${SERVER_PORT:8080}

# ---- Base de datos MySQL ----
# Cada valor se puede cambiar con una variable de entorno (la de la izquierda de los dos puntos).
# Si la variable no existe se usa el valor por defecto (el de la derecha).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coworkhub?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:coworkhub}
spring.datasource.password=${DB_PASSWORD:coworkhub}

# ---- JPA ----
# create: en cada arranque borra las tablas, las crea y ejecuta import.sql
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Seguridad (JWT) ----
app.jwt.secret=${JWT_SECRET:coworkhub-clave-secreta-para-jwt-de-mas-de-32-caracteres}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---- Regla de cancelacion (RN-08): porcentaje que se cobra entre 24 h y 2 h ----
app.cancelacion.porcentaje=${CANCELACION_PORCENTAJE:50}

# ---- CORS: direcciones desde donde se permite abrir el frontend (separadas por coma) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:63342,http://127.0.0.1:63342}

# ---- Swagger ----
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
